<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Nexa;src:url(nexa-bold.otf);font-weight:700}
@font-face{font-family:Nexa;src:url(nexa-light.otf);font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1830;font-family:Nexa,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 700px}
#panel{position:absolute;left:0;top:2px;width:1080px;height:1916px}
#glow{position:absolute;left:90px;top:250px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,120,.35),rgba(255,120,90,0) 65%);mix-blend-mode:screen}
#eyes{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sweep{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 330px 260px at 545px 300px,#000 70%,transparent 100%)}
#sweep div{position:absolute;top:-200px;width:160px;height:900px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:rotate(22deg)}
#tris{position:absolute;inset:0}
#shade{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(180deg,rgba(11,24,48,0),rgba(11,24,48,.85) 55%,#0b1830)}
.txt{position:absolute;left:0;right:0;text-align:center;color:#fff}
#t1{top:1540px;font-size:44px;font-weight:300;letter-spacing:2px}
#t2{top:1600px;font-size:118px;font-weight:700;letter-spacing:-1px}
#t3{top:1750px;font-size:34px;font-weight:300;letter-spacing:3px;color:#ffffffd0}
#end{position:absolute;inset:0;background:#0b1830;opacity:0}
#bar{position:absolute;left:0;top:0;width:18px;height:1920px;background:linear-gradient(180deg,#0075C9,#6A3D9A 35%,#E4202E 70%,#8E1537)}
#logo{position:absolute;left:240px;top:700px;width:600px}
#e1{top:1080px;font-size:46px;font-weight:700}
#e2{top:1150px;font-size:34px;font-weight:300;color:#ffffffc0}
#fade{position:absolute;inset:0;background:#000}
</style></head><body>
<div id="stage">
  <img id="panel" src="panel.png">
  <div id="glow"></div>
  <div id="sweep"><div id="sw"></div></div>
  <svg id="eyes" viewBox="0 0 1080 1920">
    <defs><filter id="bl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <ellipse cx="459" cy="357" rx="52" ry="50" fill="#070918"/>
    <ellipse cx="642" cy="387" rx="48" ry="47" fill="#070918"/>
    <g id="eyeL"></g><g id="eyeR"></g>
  </svg>
  <svg id="tris" viewBox="0 0 1080 1920"></svg>
</div>
<div id="shade"></div>
<div class="txt" id="t1">Te presento a</div>
<div class="txt" id="t2">El Estratega</div>
<div class="txt" id="t3">GOBIERNO · ELECCIONES · PLANEACIÓN</div>
<div id="end"><div id="bar"></div><img id="logo" src="domo-politico-blanco.png">
  <div class="txt" id="e1">WhatsApp 951 440 2226</div>
  <div class="txt" id="e2">Consultoría política e inteligencia electoral · Oaxaca</div></div>
<div id="fade"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),p=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
function inUp(el,k,d=50){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*d}px)`}
// ojos: modo redondo (blink = escala vertical) o feliz (arco)
function eye(g,cx,cy,r,open,happy,glow){
  const c='#7fd6ff',core='#bfefff';
  if(happy>0.5){
    const w=r*1.05,h=r*.75;
    const d=`M${cx-w} ${cy+h*.35} Q${cx} ${cy-h*1.3} ${cx+w} ${cy+h*.35}`;
    g.innerHTML=`<path d="${d}" stroke="${c}" stroke-width="${r*.55}" fill="none" stroke-linecap="round" filter="url(#bl)" opacity="${.9*glow}"/>
                 <path d="${d}" stroke="${core}" stroke-width="${r*.38}" fill="none" stroke-linecap="round"/>`;
  } else {
    const ry=Math.max(2,r*open);
    g.innerHTML=`<ellipse cx="${cx}" cy="${cy}" rx="${r*1.15}" ry="${ry*1.15}" fill="${c}" filter="url(#bl)" opacity="${.9*glow}"/>
                 <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${ry}" fill="${c}"/>
                 <ellipse cx="${cx-r*.25}" cy="${cy-ry*.3}" rx="${r*.45}" ry="${ry*.4}" fill="${core}" opacity=".8"/>`;
  }
}
// triángulos geodésicos flotando
const pal=['#0075C9','#6A3D9A','#E4202E','#8E1537','#ffffff'];const T=[];
for(let i=0;i<26;i++){const x=(i*397)%1080,y=200+(i*733)%1300,s=10+(i*7)%22;T.push({x,y,s,c:pal[i%5],sp:12+(i*5)%20,ph:i});}
function render(t){
  $('fade').style.opacity=1-eo(p(t,0,.8));
  const z=1+0.07*eio(p(t,0,7.2)); $('stage').style.transform=`scale(${z}) translateY(${Math.sin(t*1.6)*4}px)`;
  $('glow').style.opacity=.55+.35*Math.sin(t*2.2);
  // barrido de luz en el casco (2.0–3.2 s)
  const k=p(t,2.0,3.2); $('sw').style.left=(150+k*820)+'px'; $('sweep').style.opacity=(k>0&&k<1)?1:0;
  // ojos
  const blink=t0=>{const d=Math.abs(t-t0);return d<.12?d/.12:1};
  const open=Math.min(blink(1.6),blink(3.6),blink(6.4));
  const happy=(t>4.2&&t<6.1)?1:0;
  const glow=.75+.25*Math.sin(t*5);
  eye($('eyeL'),459,357,31,open,happy,glow); eye($('eyeR'),642,387,29,open,happy,glow);
  // triángulos
  $('tris').innerHTML=T.map(o=>{const y=o.y-((t*o.sp)%300),a=eo(p(t,.6,1.6))*.55*(0.6+.4*Math.sin(t*2+o.ph));
    return `<polygon points="${o.x},${y-o.s} ${o.x-o.s*.87},${y+o.s*.5} ${o.x+o.s*.87},${y+o.s*.5}" fill="none" stroke="${o.c}" stroke-width="3" opacity="${a}" transform="rotate(${t*20+o.ph*15} ${o.x} ${y})"/>`}).join('');
  // textos
  inUp($('t1'),eo(p(t,1.0,1.6))); inUp($('t2'),eo(p(t,1.3,2.0)),70); inUp($('t3'),eo(p(t,2.6,3.2)),30);
  // cierre (7.2–10)
  const e=eio(p(t,7.2,7.8)); $('end').style.opacity=e;
  const lk=eo(p(t,7.7,8.4)); $('logo').style.opacity=lk; $('logo').style.transform=`scale(${.92+.08*lk})`;
  inUp($('e1'),eo(p(t,8.2,8.7)),30); inUp($('e2'),eo(p(t,8.4,8.9)),30);
}
window.render=render; render(0);
</script></body></html>
