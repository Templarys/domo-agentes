<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Nexa;src:url(nexa-bold.otf);font-weight:700}
@font-face{font-family:Nexa;src:url(nexa-light.otf);font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1830;font-family:Nexa,sans-serif}
#stage{position:absolute;inset:0;transform-origin:540px 900px}
.p{position:absolute;left:0;top:2px;width:1080px;height:1916px;opacity:0}
#tris{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 540px 700px,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);opacity:0;mix-blend-mode:screen}
#shade{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(180deg,rgba(11,24,48,0),rgba(11,24,48,.85) 55%,#0b1830)}
.txt{position:absolute;left:60px;right:60px;text-align:center;color:#fff;opacity:0}
.big{top:1590px;font-size:84px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.big b{color:#E4202E}
#end{position:absolute;inset:0;background:#0b1830;opacity:0}
#bar{position:absolute;left:0;top:0;width:18px;height:1920px;background:linear-gradient(180deg,#0075C9,#6A3D9A 35%,#E4202E 70%,#8E1537)}
#logo{position:absolute;left:240px;top:700px;width:600px}
#e1{top:1080px;font-size:46px;font-weight:700;opacity:1}
#e2{top:1150px;font-size:34px;font-weight:300;color:#ffffffc0;opacity:1}
#fade{position:absolute;inset:0;background:#000}
</style></head><body>
<div id="stage">
  <img class="p" id="p0" src="p0.png"><img class="p" id="p1" src="p1.png"><img class="p" id="p2" src="p2.png"><img class="p" id="p3" src="p3.png">
  <svg id="tris" viewBox="0 0 1080 1920"></svg>
</div>
<div id="flash"></div>
<div id="shade"></div>
<div class="txt big" id="t0">Hola, soy<br><b>El Estratega</b></div>
<div class="txt big" id="t1">¡Mucho gusto!</div>
<div class="txt big" id="t2">Tu campaña necesita<br>un <b>plan</b>…</div>
<div class="txt big" id="t3">…y un <b>cuarto<br>de guerra.</b></div>
<div id="end"><div id="bar"></div><img id="logo" src="domo-politico-blanco.png">
  <div class="txt" id="e1">WhatsApp 951 440 2226</div>
  <div class="txt" id="e2">Consultoría política e inteligencia electoral · Oaxaca</div></div>
<div id="fade"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),p=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
// cortes de pose
const C=[0,2.8,5.4,8.2,11.0]; const X=.22; // duración del cruce
const pal=['#0075C9','#6A3D9A','#E4202E','#8E1537','#ffffff'];const T=[];
for(let i=0;i<26;i++){T.push({x:(i*397)%1080,y:200+(i*733)%1300,s:10+(i*7)%22,c:pal[i%5],sp:12+(i*5)%20,ph:i});}
function render(t){
  $('fade').style.opacity=1-eo(p(t,0,.7));
  for(let i=0;i<4;i++){
    const a=i==0?1:eo(p(t,C[i],C[i]+X)); const b=i==3?1:1-eo(p(t,C[i+1],C[i+1]+X));
    $('p'+i).style.opacity=Math.min(a,b);
    // "pop" al entrar cada pose
    const pop=1+0.035*(1-eo(p(t,C[i],C[i]+.45)));
    $('p'+i).style.transform=`scale(${pop})`;
  }
  // flash corto en cada cambio
  let f=0;for(let i=1;i<4;i++){const d=t-C[i]; if(d>=0&&d<.35) f=Math.max(f,1-d/.35);} $('flash').style.opacity=f*.8;
  const z=1+0.05*eio(p(t,0,11)); $('stage').style.transform=`scale(${z}) translateY(${Math.sin(t*1.8)*5}px)`;
  $('tris').innerHTML=T.map(o=>{const y=o.y-((t*o.sp)%300),a=eo(p(t,.5,1.4))*.55*(0.6+.4*Math.sin(t*2+o.ph));
    return `<polygon points="${o.x},${y-o.s} ${o.x-o.s*.87},${y+o.s*.5} ${o.x+o.s*.87},${y+o.s*.5}" fill="none" stroke="${o.c}" stroke-width="3" opacity="${a}" transform="rotate(${t*20+o.ph*15} ${o.x} ${y})"/>`}).join('');
  // textos por pose
  const W=[[0.6,2.7],[3.0,5.3],[5.6,8.1],[8.4,10.8]];
  W.forEach(([a,b],i)=>{const k=eo(p(t,a,a+.45))*(1-eio(p(t,b-.25,b)));const el=$('t'+i);el.style.opacity=k;el.style.transform=`translateY(${(1-eo(p(t,a,a+.45)))*50}px)`});
  // cierre
  $('end').style.opacity=eio(p(t,11.0,11.6));
  const lk=eo(p(t,11.5,12.2)); $('logo').style.opacity=lk; $('logo').style.transform=`scale(${.92+.08*lk})`;
  [['e1',12.0],['e2',12.2]].forEach(([id,a])=>{const k=eo(p(t,a,a+.5));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*30}px)`});
}
window.render=render; render(0);
</script></body></html>
