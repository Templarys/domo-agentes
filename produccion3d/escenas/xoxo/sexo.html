<script type="module">
import * as THREE from 'three';
import { crearEstudio, suave, rebote, semilla } from '/motor/estudio.js';

import { montarComun, capa, lim, fuentesListas } from './comun.js';
montarComun({ fuente: true });
const { renderer, escena, cam } = crearEstudio({ radio: 7 });
const r = semilla(3);

const items = vals.map(([v, c, op], i) => {

  const m = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1, 1.8), new THREE.MeshStandardMaterial({ color: c, roughness: .5 })); m.castShadow = m.receiveShadow = true; m.position.set(x, 0, -.6); escena.add(m);

const pv = new THREE.Vector3(); const T0 = 33.9;
window.render = t => {
  const u = t - T0;
  const c = suave(lim(u / 5.5)); cam.position.set(2.5 - c * 2.5, 6.5, 30 - c * 2); cam.lookAt(0, 1.35, 0); cam.updateMatrixWorld();
  items.forEach((b, i) => {
    b.p.scale.setScalar(1.25 * Math.max(.0001, rebote(lim((u - .1 - i * .2) / .45)))); animarPersona(b.p, t, 0); b.p.rotation.y = Math.sin(t * 1.2 + i) * .15;
    const k = suave(lim((t - 36.4 - i * .3) / .9)); const h = Math.max(.01, H(b.v) * k); b.m.scale.y = h; b.m.position.y = h / 2;
    pv.set(b.m.position.x, h + .3, b.m.position.z).project(cam); b.el.style.left = ((pv.x + 1) / 2 * 1080) + 'px'; b.el.style.top = ((1 - pv.y) / 2 * 1920) + 'px'; b.el.style.opacity = lim((t - 36.7 - i * .3) / .3); });
  capa(t); renderer.render(escena, cam);
};
await fuentesListas(); window.listo = true;
</script></body></html>
