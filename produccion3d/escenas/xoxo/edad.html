<div id="tit">La edad<br><span>también pesó</span><small>Participación por grupo de edad</small></div>
<script type="module">
import * as THREE from 'three';
import { crearEstudio, suave, rebote } from '/motor/estudio.js';
import { montarComun, capa, lim, fuentesListas } from './comun.js';

const poses = await Promise.all(['idea', 'cintura'].map(p => tarjeta('/assets/mascotas/pose_' + p + '_card.png')));

soporte.position.set(-2.6, 0, 3.0); escena.add(soporte);

const V = '#2fae62', A = '#f2c12e', N = '#f08a2e', R = '#E4202E';
const datos = [['18-24', 61.2, N], ['25-34', 57.7, R], ['35-44', 66.2, N], ['45-54', 73.6, A], ['55-64', 77.9, V], ['65+', 75.7, A]];
const barras = datos.map(([e, v, col], i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(.62, 1, .62), new THREE.MeshStandardMaterial({ color: col, roughness: .55, emissive: col, emissiveIntensity: 0 })); m.castShadow = m.receiveShadow = true; m.position.set(-1.55 + i * 1.04, 0, -.8); escena.add(m);
  const et = document.createElement('div'); et.className = 'et'; et.textContent = v.toFixed(1) + '%'; document.body.appendChild(et);
  const ej = document.createElement('div'); ej.className = 'eje'; ej.textContent = e; document.body.appendChild(ej);
  return { m, v, et, ej, e }; });

const realce = { '55-64': 26.4, '25-34': 30.8 };

  const u = t - T0;
  const c = suave(lim(u / 9.6)); cam.position.set(.35 + c * .2, 6 - c * .6, 26.5 - c * 1.2); cam.lookAt(.45, 1.25, 0); cam.updateMatrixWorld();
  const e = rebote(lim((u - .1) / .7)); soporte.scale.setScalar(Math.max(.0001, e) * .74); soporte.rotation.y = .35 + (1 - lim((u - .1) / 1)) * 1.2 + Math.sin(t * 1.4) * .05;
  mat.map = t < 30.8 ? poses[0] : poses[1];
  const salto = a => Math.max(0, Math.sin(lim((t - a) / .35) * Math.PI)) * .5;
  carta.position.y = 1.95 + Math.sin(t * 2.2) * .06 + salto(26.4) + salto(30.8);
  barras.forEach((b, i) => { const k = suave(lim((u - .3 - i * .15) / .8)); const h = Math.max(.01, H(b.v) * k);
    const r = realce[b.e], pulso = r ? lim((t - r) / .25) * (1 - lim((t - r - 2.6) / .4)) : 0;
    b.m.scale.set(1 + .18 * pulso, h, 1 + .18 * pulso); b.m.position.y = h / 2; b.m.material.emissiveIntensity = .25 * pulso;
    const otro = Object.entries(realce).some(([e2, t2]) => e2 !== b.e && t >= t2 && t < t2 + 3) && !pulso;
    pv.set(b.m.position.x, h + .2, b.m.position.z).project(cam); b.et.style.left = ((pv.x + 1) / 2 * 1080) + 'px'; b.et.style.top = ((1 - pv.y) / 2 * 1920) + 'px';
    b.et.style.opacity = lim((u - .8 - i * .15) / .3) * (otro ? .45 : 1); b.et.style.fontSize = (34 + 6 * pulso) + 'px';
    pv.set(b.m.position.x, 0, b.m.position.z + .5).project(cam); b.ej.style.left = ((pv.x + 1) / 2 * 1080) + 'px'; b.ej.style.top = ((1 - pv.y) / 2 * 1920 + 6) + 'px'; b.ej.style.opacity = lim((u - .5) / .4);
  });
