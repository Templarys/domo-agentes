<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/motor/estilo.css">
<style>#tit{position:absolute;left:70px;right:170px;top:250px;background:rgba(245,241,232,.93);border-radius:24px;padding:22px 30px;font-weight:800;font-size:62px;line-height:1.04;color:#0b1830;box-shadow:0 8px 30px rgba(11,24,48,.08)}
#tit span{color:#8E1537}
#cifra{position:absolute;left:70px;right:130px;top:900px;text-align:center;opacity:0}
#cifra b{display:block;font-weight:800;font-size:150px;line-height:1;color:#8E1537}
#cifra span{display:block;font-weight:300;font-size:36px;color:#0b1830;margin-top:10px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="tit">Casi 1 de cada 4 votos<br><span>vino de menores de 30</span></div>
<div id="cifra"><b>24.4%</b><span>de los votos emitidos</span></div>
<script type="module">
import * as THREE from 'three';
import { crearEstudio, suave, rebote, semilla } from '/motor/estudio.js';
import { crearPersona, animarPersona, colorear } from '/motor/personas.js';
import { montarComun, capa, lim, fuentesListas } from './comun.js';
montarComun({ fuente: true });
const { renderer, escena, cam } = crearEstudio({ radio: 7 });
const r = semilla(21); const gente = [];
for (let i = 0; i < 4; i++) { const p = crearPersona({ azar: r, ropa: '#b9b3a8', escala: 1.2 }); p.position.set((i - 1.5) * 1.5, 0, 0); p.userData.i = i; escena.add(p); gente.push(p);
  p.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; } }); p.userData.mats.ropa = p.userData.torso.material; }
const joven = gente[1]; const T0 = 39.433;
window.render = t => {
  const u = t - T0;
  const c = suave(lim(u / 4.4)); cam.position.set(-1.5 + c * 1.5, 6, 24 - c * 2); cam.lookAt(0, -.6, 0); cam.updateMatrixWorld();
  for (const p of gente) { const d = p.userData; p.scale.setScalar(1.2 * Math.max(.0001, rebote(lim((u - .1 - d.i * .12) / .4))));
    const k = suave(lim((t - 40.6) / .5));
    if (p === joven) { if (k > 0) colorear(p, '#8E1537'); p.position.z = .6 * k; p.position.y = .35 * Math.sin(k * Math.PI); }
    else p.traverse(o => { if (o.isMesh) o.material.opacity = 1 - .5 * k; });
    animarPersona(p, t, 0); }
  document.getElementById('cifra').style.opacity = lim((t - 40.8) / .35);
  capa(t); renderer.render(escena, cam);
};
await fuentesListas(); window.listo = true;
</script></body></html>
