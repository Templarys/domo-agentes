<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/motor/estilo.css">
<style>#tit{position:absolute;left:70px;right:170px;top:250px;background:rgba(245,241,232,.93);border-radius:24px;padding:22px 30px;box-shadow:0 8px 30px rgba(11,24,48,.08)}
#tit small{display:block;font-weight:300;font-size:36px;color:#0b1830}
#tit div{font-weight:800;font-size:104px;line-height:1;color:#8E1537;margin-top:6px}#tit div i{font-style:normal;font-size:44px;color:#0b1830;margin-left:14px}
#cifra{position:absolute;left:70px;right:130px;top:930px;text-align:center;opacity:0}
#cifra b{display:block;font-weight:800;font-size:140px;line-height:1;color:#8E1537}
#cifra span{display:block;font-weight:800;font-size:34px;color:#0b1830;margin-top:8px}
#cifra small{display:block;font-weight:300;font-size:28px;color:#3d4454;margin-top:6px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="tit"><small>En 2024 votaron</small><div><span id="n">0</span><i>personas</i></div></div>
<div id="cifra"><b>67.0%</b><span>de la lista nominal (76,893) · ≈ 7 de cada 10</span><small>calculado sin registros no especificados</small></div>
<script type="module">
import * as THREE from 'three';
import { crearEstudio, suave, rebote, semilla } from '/motor/estudio.js';
import { crearPersona, animarPersona, colorear } from '/motor/personas.js';
import { montarComun, capa, lim, fuentesListas } from './comun.js';
montarComun({ fuente: true });
const { renderer, escena, cam } = crearEstudio({ radio: 9 });
const r = semilla(11); const gente = [];
for (let i = 0; i < 10; i++) {
  const p = crearPersona({ azar: r, ropa: '#b9b3a8', escala: 1 });
  const fila = Math.floor(i / 5), col = i % 5; p.position.set((col - 2) * 1.25 + (fila ? .62 : 0), 0, fila ? -1.6 : 0);
  p.userData.i = i; p.userData.base = p.position.clone(); escena.add(p); gente.push(p);
  p.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; } }); p.userData.mats.ropa = p.userData.torso.material;
}
const res = [5, 6, 7, 8, 0, 1, 2].map(i => gente[i]); // 7 de 10 ≈ 67.0%
const T0 = 3.0, TG = 8.0;
window.render = t => {
  const u = t - T0;
  for (const p of gente) { const d = p.userData;
    p.scale.setScalar(Math.max(.0001, rebote(lim((u - .1 - d.i * .1) / .4))));
    const es = res.includes(p), k = es ? suave(lim((t - TG - res.indexOf(p) * .1) / .45)) : 0;
    if (es && k > 0) colorear(p, '#8E1537');
    p.position.set(d.base.x, k * .25 * Math.sin(k * Math.PI), d.base.z + k * .35);
    if (!es) p.traverse(o => { if (o.isMesh) o.material.opacity = 1 - .5 * lim((t - TG) / .8); });
    animarPersona(p, t, 0);
  }
  const c = suave(lim(u / 7.7)); cam.position.set(-1.5 + c * 1.5, 9 - c, 29 - c * 2); cam.lookAt(0.2, -1.3, -0.8);
  document.getElementById('n').textContent = Math.round(49696 * suave(lim((u - .2) / 3.6))).toLocaleString('en-US');
  document.getElementById('cifra').style.opacity = lim((t - TG) / .35);
  capa(t); renderer.render(escena, cam);
};
await fuentesListas(); window.listo = true;
</script></body></html>
