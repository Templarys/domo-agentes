<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/motor/estilo.css">
<style>.pildora{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:40px;padding:14px 26px;font-weight:800;font-size:34px;box-shadow:0 10px 30px rgba(11,24,48,.18);white-space:nowrap;opacity:0}
.pildora small{display:block;font-weight:300;font-size:22px;color:#4a5160}
.pildora::after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
#leyenda{bottom:500px;background:rgba(255,255,255,.92);border-radius:20px;padding:16px 22px;font-size:22px;font-weight:300}
#leyenda i{display:inline-block;width:46px;height:16px;border-radius:4px;margin:0 6px -2px 14px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<img class="logo" src="/assets/marca/domo-politico.png">
<div class="capa titulo" id="t">Cada sección<br><span>vota distinto</span></div>
<div class="pildora" id="pA"></div><div class="pildora" id="pB"></div>
<div class="capa" id="leyenda">Participación 2024 <i style="background:#e9d6cf"></i>menor <i style="background:#8E1537"></i>mayor</div>
<div class="capa fuente">Secciones y participación: INE (BGD y Conteos Censales 2024). Edificios: Overture Maps (alturas estimadas). Calles: © OpenStreetMap contributors.</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { crearCiudad, suave } from '/motor/ciudad.js';
const lim = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const datos = await (await fetch('ciudad.json')).json();
const secc = (await (await fetch('secciones.json')).json()).secciones;
const { renderer, escena, cam } = await crearCiudad(datos, { nieblaDesde: 1800, nieblaHasta: 4200 });
// Coropleta en el suelo (debajo de los edificios) y contornos oscuros de cada sección
const ps = secc.map(s => s.part), pmin = Math.min(...ps), pmax = Math.max(...ps);
const cA = new THREE.Color('#e9d6cf'), cB = new THREE.Color('#8E1537');
const mats = [];
for (const s of secc) {
  const col = cA.clone().lerp(cB, (s.part - pmin) / (pmax - pmin || 1));
  for (const r of s.rings) {
    const sh = new THREE.Shape(r.map(([x, y]) => new THREE.Vector2(x, -y)));
    const g = new THREE.ShapeGeometry(sh); g.rotateX(-Math.PI / 2); g.translate(0, .7, 0);
    const m = new THREE.MeshStandardMaterial({ color: col, transparent: true, opacity: 0, roughness: 1, depthWrite: false });
    const mesh = new THREE.Mesh(g, m); mesh.receiveShadow = true; escena.add(mesh); mats.push(m);
    const tiras = [];
    for (let i = 0; i < r.length - 1; i++) { const [x1, y1] = r[i], [x2, y2] = r[i + 1], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (!L) continue; const w = 2.2, nx = -dy / L * w, ny = dx / L * w;
      const t = new THREE.BufferGeometry(); t.setAttribute('position', new THREE.Float32BufferAttribute([x1 + nx, 1.2, -(y1 + ny), x1 - nx, 1.2, -(y1 - ny), x2 + nx, 1.2, -(y2 + ny), x2 - nx, 1.2, -(y2 - ny)], 3)); t.setIndex([0, 2, 1, 1, 2, 3]); tiras.push(t); }
    const borde = new THREE.Mesh(mergeGeometries(tiras), new THREE.MeshBasicMaterial({ color: '#0b1830', transparent: true, opacity: 0, side: THREE.DoubleSide })); escena.add(borde); mats.push(borde.material);
  }
}
const A = secc.find(s => s.s === 583), B = secc.find(s => s.s === 556);
const pill = (el, s, color) => { el.innerHTML = `Sección ${s.s}<small>votó el ${(s.part * 100).toFixed(1)}%</small>`; el.style.color = color; };
pill(document.getElementById('pA'), A, '#0075C9'); pill(document.getElementById('pB'), B, '#8E1537');
const v = new THREE.Vector3(); const proyectar = (el, s, op) => { v.set(s.c[0], 40, -s.c[1]).project(cam); el.style.left = ((v.x + 1) / 2 * 1080) + 'px'; el.style.top = ((1 - v.y) / 2 * 1920) + 'px'; el.style.opacity = op; };
const DUR = 9;
window.render = t => {
  const k = suave(lim((t - .5) / (DUR - 1.2)));
  const desde = new THREE.Vector3(A.c[0], 0, -A.c[1]), hasta = new THREE.Vector3(B.c[0], 0, -B.c[1]);
  const foco = desde.clone().lerp(hasta, k);
  cam.position.set(foco.x - 220 + k * 120, 760 - Math.sin(k * Math.PI) * 140, foco.z + 520); cam.lookAt(foco.x, 0, foco.z - 60);
  const op = lim((t - .3) / 1); mats.forEach(m => m.opacity = m.isMeshBasicMaterial ? .85 * op : .62 * op);
  renderer.render(escena, cam);
  proyectar(document.getElementById('pA'), A, lim((t - 1.2) / .4) * (1 - lim((t - 5.5) / .5) * .6));
  proyectar(document.getElementById('pB'), B, lim((t - 5) / .4));
  document.getElementById('t').style.opacity = lim((t - .2) / .5);
};
await document.fonts.ready; window.listo = true;
</script></body></html>
