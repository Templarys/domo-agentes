<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/motor/estilo.css">
<style>#cifra{position:absolute;left:0;right:0;top:1360px;text-align:center;font-weight:800;font-size:150px;color:var(--guinda);opacity:0}
#cifra small{display:block;font-size:46px;color:var(--oscuro);font-weight:300;margin-top:6px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<img class="logo" src="/assets/marca/domo-politico.png">
<div class="capa titulo" id="t">De cada 10 personas<br><span>en la lista, votaron 6</span></div>
<div id="cifra"><span id="n">0</span>%<small>6 de cada 10 · ejemplo de proporción</small></div>
<script type="module">
import * as THREE from 'three';
import { crearEstudio, suave, rebote, lim, semilla } from '/motor/estudio.js';
import { crearPersona, animarPersona, colorear } from '/motor/personas.js';
const { renderer, escena, cam } = crearEstudio({ radio: 9 });
const r = semilla(5); const gente = [];
// 10 figuras en arco; las 6 primeras (exactamente 60%) se resaltan en guinda
for (let i = 0; i < 10; i++) {
  const p = crearPersona({ azar: r, ropa: '#b9b3a8', escala: 1 });
  // Dos filas de cinco (formato vertical): 10 figuras completas en cuadro
  const fila = Math.floor(i / 5), col = i % 5; p.position.set((col - 2) * 1.25 + (fila ? .62 : 0), 0, fila ? -1.6 : 0);
  p.userData.i = i; p.userData.base = p.position.clone(); escena.add(p); gente.push(p);
}
const resaltadas = [gente[5], gente[6], gente[7], gente[0], gente[1], gente[2]]; // proporción exacta: 6 de 10
const DUR = 8;
window.render = t => {
  for (const p of gente) { const u = p.userData;
    const ap = lim((t - .4 - u.i * .14) / .4); p.scale.setScalar(Math.max(.0001, rebote(ap)));
    const res = resaltadas.includes(p); const k = res ? suave(lim((t - 3 - u.i * .12) / .5)) : 0;
    if (res && k > 0) colorear(p, '#8E1537');
    p.position.set(u.base.x, 0, u.base.z + k * .35); p.rotation.y = 0;
    if (!res && t > 3) { p.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 1 - .45 * lim((t - 3) / .8); } }); }
    animarPersona(p, t, 0);
  }
  const c = suave(lim(t / DUR)); cam.position.set(-3 + c * 3, 9 - c * 2.5, 28 - c * 3); cam.lookAt(0.3, -0.9, -0.8);
  document.getElementById('t').style.opacity = lim((t - .2) / .5);
  const kc = lim((t - 3.2) / 1.2); document.getElementById('cifra').style.opacity = lim((t - 3) / .4);
  document.getElementById('n').textContent = Math.round(60 * suave(kc));
  renderer.render(escena, cam);
};
await document.fonts.ready; window.listo = true;
</script></body></html>
